<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101810">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OFFROAD ON">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <title>OFFROAD ON</title>
  <style>
    html,body{margin:0;height:100%;background:#101810;color:#fff;font-family:system-ui,sans-serif}
    main{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    h1{font-size:clamp(2rem,9vw,5rem);margin:.2em 0}
    p{opacity:.8;max-width:36rem}
  </style>
</head>
<body>
  <main>
    <div>
      <h1>OFFROAD ON</h1>
      <p>Dahod driving game — Dahod to Jesavada, Garbada and Abhlod.</p>
      <p id="status">PWA shell ready. Add the 3D game build here.</p>
    </div>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js'));
    }
  </script>
</body>
</html>
